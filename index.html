<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>J'apprends les échecs</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Apprendre les échecs pas à pas : test de niveau, leçons interactives, exercices, parties contre l'ordinateur.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Échecs">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f2ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171a17" media="(prefers-color-scheme: dark)">
<style>
:root{
  --bg:#f6f2ea; --card:#ffffff; --ink:#1f2a24; --muted:#6a746d; --line:#e2dccd;
  --accent:#2f6b4f; --accent-ink:#ffffff; --accent-soft:#e3efe8; --gold:#b8862b; --gold-soft:#f8ecd0;
  --good:#2f8a4a; --good-soft:#dff3e5; --bad:#c0392b; --bad-soft:#fbe3df; --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
  --sq-l:#f0d9b5; --sq-d:#b58863;
  --serif:Georgia,'Times New Roman',serif; --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#171a17; --card:#222722; --ink:#ecefe9; --muted:#9aa59d; --line:#323a33;
  --accent:#58b98a; --accent-ink:#0e1a14; --accent-soft:#1f3328; --gold:#e0b25a; --gold-soft:#3a3120;
  --good:#5ac27a; --good-soft:#1f3a29; --bad:#ef7b6d; --bad-soft:#41231f; --shadow:0 1px 2px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --bg:#171a17; --card:#222722; --ink:#ecefe9; --muted:#9aa59d; --line:#323a33;
  --accent:#58b98a; --accent-ink:#0e1a14; --accent-soft:#1f3328; --gold:#e0b25a; --gold-soft:#3a3120;
  --good:#5ac27a; --good-soft:#1f3a29; --bad:#ef7b6d; --bad-soft:#41231f; --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--serif);margin:0 0 .4em;line-height:1.2;letter-spacing:.1px}
h1{font-size:1.55rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
p{margin:0 0 .75em}
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:10px}
.topbar .logo{font-family:var(--serif);font-weight:700;font-size:1.05rem;display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.topbar .logo span.k{font-size:1.5rem;line-height:1;filter:grayscale(.2)}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 10px;font-size:.82rem;background:var(--accent-soft);color:var(--accent);font-weight:600;white-space:nowrap}
.chip.gold{background:var(--gold-soft);color:var(--gold)} .chip.good{background:var(--good-soft);color:var(--good)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.mute{background:var(--line);color:var(--muted)}
main{max-width:600px;margin:0 auto;padding:14px 16px calc(92px + env(safe-area-inset-bottom))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabs .in{display:flex;width:100%;max-width:600px}
.tab{flex:1;border:0;background:none;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:.72rem;border-radius:10px}
.tab .ic{font-size:1.35rem;line-height:1.1}
.tab.on{color:var(--accent);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:0 0 12px;box-shadow:var(--shadow)}
.card.hero{background:linear-gradient(135deg,var(--accent) 0%,#245640 100%);color:#fff;border:0}
.card.hero h2,.card.hero p{color:#fff}
.card.soft{background:var(--accent-soft);border-color:transparent;box-shadow:none}
.card.gold{background:var(--gold-soft);border-color:transparent;box-shadow:none}
.row{display:flex;align-items:center;gap:10px}.row.sp{justify-content:space-between}.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)} .small{font-size:.86rem} .tiny{font-size:.76rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:11px 16px;background:var(--accent);color:var(--accent-ink);font-weight:700;text-decoration:none;min-height:44px}
.btn.sec{background:var(--accent-soft);color:var(--accent)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:600}
.btn.gold{background:var(--gold);color:#fff} .btn.danger{background:var(--bad);color:#fff}
.btn.block{display:flex;width:100%}.btn.sm{padding:7px 12px;min-height:36px;font-size:.9rem;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.hero .btn{background:#fff;color:#245640}
.hero .btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;width:100%;box-shadow:var(--shadow)}
.item .em{font-size:1.6rem;width:38px;text-align:center}
.item .tt{font-weight:700} .item .sub{font-size:.84rem;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;margin:0 0 12px}.seg button{flex:1;border:0;background:none;padding:8px;border-radius:9px;font-weight:600;color:var(--muted)}.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}.stat b{display:block;font-size:1.5rem;font-family:var(--serif)}
.stars{letter-spacing:2px;color:var(--gold)}
input[type=text],textarea{width:100%;font:inherit;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:90px;font-size:.8rem}
.msg{border-radius:12px;padding:10px 12px;margin:10px 0;font-size:.95rem}
.msg.good{background:var(--good-soft);color:var(--good)} .msg.bad{background:var(--bad-soft);color:var(--bad)} .msg.info{background:var(--accent-soft);color:var(--accent)} .msg.gold{background:var(--gold-soft);color:var(--ink)}
/* échiquier */
.bwrap{width:100%;max-width:min(100%,480px);margin:0 auto 10px;position:relative}
.board{position:relative;width:100%;aspect-ratio:1/1;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border-radius:6px;overflow:hidden;border:2px solid #7a5a3a;user-select:none;-webkit-user-select:none;touch-action:manipulation;background:var(--sq-d)}
.sq{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.sq.light{background:var(--sq-l)}.sq.dark{background:var(--sq-d)}
.sq.lm::before{content:"";position:absolute;inset:0;background:rgba(255,214,0,.38)}
.sq.sel::before{content:"";position:absolute;inset:0;background:rgba(20,160,90,.5)}
.sq.chk::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(230,40,30,.85) 0%,rgba(230,40,30,.0) 75%)}
.sq.hl::before{content:"";position:absolute;inset:0;background:rgba(255,200,0,.5)}
.sq.good::before{content:"";position:absolute;inset:0;background:rgba(40,170,80,.55)}
.sq.bad::before{content:"";position:absolute;inset:0;background:rgba(220,50,40,.55)}
.sq .dot{position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(20,70,40,.38);pointer-events:none}
.sq.cap .dot{width:88%;height:88%;background:transparent;border:calc(var(--cs,40px)*.09) solid rgba(20,70,40,.38)}
.sq .co{position:absolute;font-size:calc(var(--cs,40px)*.24);font-weight:700;line-height:1;opacity:.75;pointer-events:none}
.sq.light .co{color:var(--sq-d)}.sq.dark .co{color:var(--sq-l)}
.sq .co.f{right:3%;bottom:2%}.sq .co.r{left:4%;top:3%}
.pc{position:relative;z-index:2;font-size:calc(var(--cs,40px)*.86);line-height:1;font-family:"Apple Symbols","Segoe UI Symbol","DejaVu Sans","Noto Sans Symbols 2","Arial Unicode MS",sans-serif;pointer-events:none;font-variant-emoji:text}
.pc.w{color:#fffdf5;-webkit-text-stroke:calc(var(--cs,40px)*.035) #1c1c1c;text-shadow:0 1px 1px rgba(0,0,0,.35)}
.pc.b{color:#1d1d1d;-webkit-text-stroke:calc(var(--cs,40px)*.02) #000;text-shadow:0 1px 1px rgba(255,255,255,.25)}
svg.arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.bcap{text-align:center;font-size:.85rem;color:var(--muted);margin:-2px 0 10px}
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px}
.modal .box{background:var(--card);border-radius:18px;padding:18px;max-width:420px;width:100%}
.promo{display:flex;gap:10px;justify-content:center}.promo button{width:64px;height:64px;border-radius:14px;border:1px solid var(--line);background:var(--sq-l);font-size:2.4rem;line-height:1}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;margin:0 0 8px;font-weight:600}
.opt.ok{border-color:var(--good);background:var(--good-soft)}.opt.ko{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{pointer-events:none}
.moves{font-family:ui-monospace,Menlo,monospace;font-size:.88rem;line-height:1.7}
.moves .mv{display:inline-block;padding:0 4px;border-radius:5px}.moves .mv.on{background:var(--accent);color:var(--accent-ink)}
.dots-nav{display:flex;gap:6px;justify-content:center;margin:6px 0 2px}.dots-nav i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots-nav i.on{background:var(--accent)}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;padding:10px 6px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:.76rem}.badge .e{font-size:1.7rem}.badge.off{opacity:.35;filter:grayscale(1)}
.back{background:none;border:0;color:var(--accent);font-weight:700;padding:4px 0;margin-bottom:6px}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.center{text-align:center}
.hide{display:none!important}
@media (min-width:700px){ main{padding-top:22px} }
</style>
</head>
<body>
<div class="topbar"><div class="logo"><span class="k">♞</span><span id="ttl">J'apprends les échecs</span></div><div id="top-r"></div></div>
<main id="app"></main>
<nav class="tabs"><div class="in" id="tabs"></div></nav>
<div id="modal"></div>
<script src="chess.min.js"></script>
<script src="engine.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
(function(){
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
})();
</script>
</body>
</html>
